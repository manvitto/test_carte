<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juxtapose multiples</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: #f2f2f2;
      border-bottom: 1px solid #d9d9d9;
    }

    .menu button {
      padding: 10px 14px;
      border: 1px solid #bfbfbf;
      background: white;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
    }

    .menu button:hover {
      background: #eaeaea;
    }

    .menu button.active {
      background: #d9e8ff;
      border-color: #7aa7e0;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 58px);
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="menu">
    <button onclick="chargerJuxtapose(1)" id="btn1">Juxtapose 1</button>
    <button onclick="chargerJuxtapose(2)" id="btn2">Juxtapose 2</button>
    <button onclick="chargerJuxtapose(3)" id="btn3">Juxtapose 3</button>
    <button onclick="chargerJuxtapose(4)" id="btn4">Juxtapose 4</button>
    <button onclick="chargerJuxtapose(5)" id="btn5">Juxtapose 5</button>
  </div>

  <iframe id="juxtaFrame" src=""></iframe>

  <script>
    const juxtaposes = {
      1: "https://cdn.knightlab.com/libs/juxtapose/latest/embed/index.html?uid=321fe590-4b2c-11f1-ba1b-0e6f42328d7d",
      2: "COLLE_ICI_LE_LIEN_DU_2E_JUXTAPOSE",
      3: "COLLE_ICI_LE_LIEN_DU_3E_JUXTAPOSE",
      4: "COLLE_ICI_LE_LIEN_DU_4E_JUXTAPOSE",
      5: "COLLE_ICI_LE_LIEN_DU_5E_JUXTAPOSE"
    };

    function chargerJuxtapose(numero) {
      const frame = document.getElementById("juxtaFrame");
      frame.src = juxtaposes[numero];

      for (let i = 1; i <= 5; i++) {
        document.getElementById("btn" + i).classList.remove("active");
      }
      document.getElementById("btn" + numero).classList.add("active");
    }

    function lireParametre() {
      const params = new URLSearchParams(window.location.search);
      const j = parseInt(params.get("j"), 10);

      if (juxtaposes[j]) {
        chargerJuxtapose(j);
      } else {
        chargerJuxtapose(1);
      }
    }

    lireParametre();
  </script>

</body>
</html>
