<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lozari — Zones</title>

<style>
  body{
    margin:0;
    background:#000;
    font-family: Arial, Helvetica, sans-serif;
    padding:40px 20px;
  }

  .container{
    max-width:1000px;
    margin:0 auto;
  }

  /* Espacement maîtrisé entre zones (plus “stable”) */
  .zone{
    margin:0 0 28px 0;
  }

  h2{
    color:#fff;
    margin:0 0 18px 0;
    line-height:1.25;
  }

  h3{
    color:#fff;
    margin:14px 0 10px 0;
  }

  .text{
    color:#fff;
    line-height:1.6;
    margin:0 0 12px 0;
  }

  ul.bullets{
    margin:0 0 12px 0;
    padding-left:22px;
    color:#fff;
    line-height:1.6;
  }
  ul.bullets li{
    margin:0 0 6px 0;
  }

  /* Wrapper Juxtapose : même taille partout, plus de iframes "petites" */
  .iframe-wrapper{
    width:100%;
    border-radius:12px;
    overflow:hidden;
    margin-top:8px;
    background:#000;
  }

  /* Hauteur uniforme (évite les variations et les "tout petits") */
  .iframe-wrapper iframe{
    width:100%;
    height:720px; /* ajuste ici si tu veux plus grand (ex: 620px) */
    border:0;
    display:block;
  }

  /* Mobile */
  @media (max-width: 720px){
    .iframe-wrapper iframe{
      height:420px;
    }
  }

  .intro-box{
    background:#575756;
    padding:20px;
    border-radius:8px;
    margin-bottom:22px;
  }
  .intro-box p{
    margin:0 0 12px 0; /* remplace tes <br><br> */
    color:#fff;
  }
  .intro-box p:last-child{
    margin-bottom:10px;
  }
</style>
</head>

<body>

  <div class="container">

    <h2>Documents d'Urbanisme</h2>

    <div class="intro-box">
      <p><b>Etat des documents d'urbanisme en 2025</b><br></p>

    <!-- ZONE 1 -->
    <section class="zone">
      </ul>
      <div class="iframe-wrapper">
        <iframe class="juxtapose" src="https://cdn.knightlab.com/libs/juxtapose/latest/embed/index.html?uid=a526a9de-0ccf-11f1-ba1b-0e6f42328d7d"></iframe>
      </div>
    </section>

   
  
   

  </div>

</body>
</html>
