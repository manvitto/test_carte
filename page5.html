<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page de Test</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      background:#49071A;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: Arial, Helvetica, sans-serif;
      color:#fff;
    }

    .container{
      width:min(900px, 92vw);
      text-align:center;
      padding:28px 16px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:28px;
      flex-wrap:wrap;
    }

    .back{
      color:#fff;
      text-decoration:none;
      border:1px solid #fff;
      padding:10px 14px;
      border-radius:999px;
      white-space:nowrap;
    }

    h1{
      margin:0;
      font-weight:300;
      letter-spacing:0.5px;
      flex:1;
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:14px;
      margin-top:18px;
    }

    @media (min-width: 720px){
      .grid{
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .btn-wrap{
      position:relative;
    }

    .btn{
      display:block;
      text-decoration:none;
      color:#fff;
      border:2px solid #fff;
      padding:14px 12px;
      border-radius:18px;
      transition:0.25s ease;
      user-select:none;
      background:transparent;
      position:relative;
      z-index:2;
    }

    .btn:hover{
      background:#fff;
      color:#49071A;
    }

    .team-popup{
      position:absolute;
      left:50%;
      bottom:calc(100% + 10px);
      transform:translateX(-50%) translateY(8px);
      width:min(360px, 88vw);
      background:#ffffff;
      color:#49071A;
      border-radius:14px;
      padding:14px 16px;
      text-align:left;
      box-shadow:0 10px 30px rgba(0,0,0,0.28);
      opacity:0;
      visibility:hidden;
      transition:0.25s ease;
      z-index:10;
      pointer-events:none;
      line-height:1.45;
    }

    .team-popup::after{
      content:"";
      position:absolute;
      top:100%;
      left:50%;
      transform:translateX(-50%);
      border-width:8px;
      border-style:solid;
      border-color:#ffffff transparent transparent transparent;
    }

    .btn-wrap:hover .team-popup{
      opacity:1;
      visibility:visible;
      transform:translateX(-50%) translateY(0);
    }

    .team-title{
      font-weight:700;
      margin-bottom:8px;
      font-size:15px;
    }

    .team-line{
      margin:4px 0;
      font-size:14px;
    }

    .hint{
      opacity:0.85;
      margin-top:14px;
      font-size:14px;
      line-height:1.4;
    }

    .btn.disabled{
      background:#777;
      border:2px solid #777;
      color:#ccc;
      cursor:not-allowed;
      pointer-events:none;
      opacity:0.6;
    }

    @media (max-width: 719px){
      .team-popup{
        left:0;
        right:0;
        margin:auto;
        transform:translateY(8px);
      }

      .btn-wrap:hover .team-popup{
        transform:translateY(0);
      }

      .team-popup::after{
        left:50%;
        transform:translateX(-50%);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="top">
      <a class="back" href="index.html">← Accueil</a>
      <h1>Page de test</h1>
      <span style="width:92px"></span>
    </div>

    <div class="grid">

      <!-- 4.1 -->
      <div class="btn-wrap">
        <a class="btn" href="qgis2web_2026_04_23-23_27_53_645909" target="_blank" rel="noopener">
          4-1 <b>Test géolocalisation</b>
        </a>
        <div class="team-popup">
          <div class="team-title">4.1 Biguglia village / San Bastianu</div>
          <div class="team-line"><b>Chef d’équipe :</b> Cappellaro Julien / Beltram Manu / Bati</div>
          <div class="team-line"><b>Équipe agent :</b> Escoffier Johan</div>
        </div>
      </div>

    </div>

    <div class="hint"></div>
  </div>
</body>
</html>
